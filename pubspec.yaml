name: fianarana
description: Application Desktop de gestion scolaire (Windows, Linux, macOS)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  pdf: ^3.11.1
  printing: ^5.13.2
  crypto: ^3.0.5
  bcrypt: ^1.1.3
  intl: 0.20.2
  collection: ^1.18.0
  file_picker: ^8.1.2
  csv: ^6.0.0
  excel: ^4.0.6
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - donnees_de_test.xlsx
